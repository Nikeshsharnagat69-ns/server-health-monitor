
name: Server Health Monitor CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psutil
        run: pip install psutil

      - name: Run Health Monitor
        run: python monitor.py
